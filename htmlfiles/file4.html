*Polymorphism*

<!DOCTYPE html>
<html>
<body>

<h2>Polymorphism Example</h2>

<script>
    class Animal {

        sound() {
            document.write("Animal makes a sound<br>");
        }
    }

    class Dog extends Animal {

        sound() {
            document.write("Dog barks<br>");
        }
    }

    class Cat extends Animal {

        sound() {
            document.write("Cat meows<br>");
        }
    class Dino extends Animal {

        sound() {
            document.write("Dino Sound<br>");
        }
    }

    let a1 = new Dog();
    let a2 = new Cat();
    let a3 = new Dino();

    a1.sound();
    a2.sound();
</script>

</body>
</html>
