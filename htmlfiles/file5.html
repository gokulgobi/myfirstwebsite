*Abstraction*

<!DOCTYPE html>
<html>
<body>

<h2>Abstraction Example</h2>

<script>
    class ATM {

        withdraw(amount) {
            this.checkBalance(amount);
            document.write("Amount withdrawn: " + amount);
        }

        checkBalance(amount) {
            document.write("Checking balance...<br>");
        }
    }

    let atm = new ATM();

    atm.withdraw(1000);
</script>

</body>
</html>
