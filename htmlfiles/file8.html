<html>
<head>
<title>
Fluid Grid</title>
<style>
*{
box-sizing:border-box;
}
.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1%;
padding:1%;
}
.box {
background-color:lightblue;
padding:10%;
text-align:center;
font-size:500%;
}
@media(max-width:600px) {
.container {
grid-template-columns:1fr;background-color:blue;
}}
</style>
</head>
<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
</body>



</html>
