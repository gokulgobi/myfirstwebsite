*JavaScript Object*

<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Object</title>
</head>
<body>

<h2>Student Details</h2>

<script>
    let student = {
        name: "SECE001",
        department: "CSE",
        mark: 90,

        display: function() {
            document.write("Name: " + this.name + "<br>");
            document.write("Department: " + this.department + "<br>");
            document.write("Mark: " + this.mark);
        }
    };

    student.display();
</script>

</body>
</html>
