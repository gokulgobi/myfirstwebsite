*Encapsulation*

<!DOCTYPE html>
<html>
<body>

<h2>Encapsulation Example</h2>

<script>
    class BankAccount {
        #balance = 5000;
        deposit(amount) {
            this.#balance += amount;
        }

        displayBalance() {
            document.write("Balance: " + this.#balance);
        }
    }
    let account = new BankAccount();

    account.deposit(2000);
    account.displayBalance();
</script>

</body>
</html>
