*Inheritanc*

<!DOCTYPE html>
<html>
<body>

<h2>Inheritance Example</h2>

<script>
    class Animal {

        eat() {
            document.write("Animal is eating<br>");
        }
    }

    class Dog extends Animal {

        bark() {
            document.write("Dog is barking");
        }
    }

    let d = new Dog();

    d.eat();
    d.bark();
</script>

</body>
</html>
